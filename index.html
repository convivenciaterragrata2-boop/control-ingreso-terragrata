<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="stylesheet" href="styles.css"><title>Control NFC Terragrata</title></head><body><header><b>CONTROL NFC<br><small>Terragrata · acceso vehicular</small></b><button id="logout" class="secondary hidden">Salir</button></header><div id="notice" class="notice">Configura Supabase en config.js.</div><main><section id="login" class="screen"><div class="card"><h1>Ingreso</h1><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn" class="primary">Iniciar sesión</button><p id="msg"></p></div></section><section id="app" class="screen"><div class="card hero"><h1>Control de ingreso</h1><p id="userInfo"></p><button id="scan" class="primary big">📳 Leer chip NFC</button><button id="manual" class="secondary">Buscar UID manualmente</button><div id="result" class="result">Esperando lectura…</div></div><div class="card"><h2>Últimos accesos</h2><div id="recent"></div></div></section><section id="vehicles" class="screen"><div class="card"><h2>Registrar vehículo</h2><form id="vf"><input id="apto" placeholder="Apartamento" required><input id="resident" placeholder="Residente" required><input id="plate" placeholder="Placa" maxlength="6" required><input id="model" placeholder="Marca / modelo"><input id="color" placeholder="Color"><input id="uid" placeholder="UID del chip NFC" required><select id="status"><option value="activo">Activo</option><option value="bloqueado">Bloqueado</option></select><button class="primary">Guardar</button></form></div><div class="card"><input id="search" placeholder="Buscar"><div id="vlist"></div></div></section><section id="logs" class="screen"><div class="card"><h2>Historial</h2><button id="csv" class="secondary">⬇ Exportar CSV</button><div id="llist"></div></div></section><section id="admin" class="screen"><div class="card"><h2>Administración</h2><p>Terragrata · Dosquebradas</p><p id="role"></p><p>La base de datos y los permisos están centralizados.</p></div></section></main><nav class="hidden" id="nav"><button data-s="app">🚗<span>Ingreso</span></button><button data-s="vehicles">🚙<span>Vehículos</span></button><button data-s="logs">📋<span>Historial</span></button><button data-s="admin">⚙️<span>Admin</span></button></nav><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
